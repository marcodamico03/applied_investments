# Default research configuration. Copy and edit for a specific experiment,
# then pass it with `--config configs/<name>.yaml`.

data:
  crsp_raw: data/raw/crsp_monthly.csv        # WRDS CRSP monthly (CIZ format)
  comp_raw: data/raw/ccm_funda.csv           # WRDS CCM-linked Compustat annual
  crsp_clean: data/interim/crsp_monthly.parquet
  comp_clean: data/interim/comp_annual.parquet
  panel: data/processed/panel.parquet
  ff_factors: data/external/ff_factors_monthly.parquet

# Accounting data is only used once it would have been public.
# 6 months after fiscal year end is the conservative standard.
reporting_lag_months: 6

# Sample periods. The test period is the holdout: only look at it once,
# after the signal and all choices are frozen (run_experiment.py --holdout).
periods:
  train: ["1963-07-31", "2005-12-31"]
  validation: ["2006-01-31", "2015-12-31"]
  test: ["2016-01-31", "2025-12-31"]

universe:
  exchanges: [N, A, Q]        # NYSE, AMEX, Nasdaq
  min_price: 5.0              # drop penny stocks (set to null to disable)
  min_me_nyse_pct: null       # e.g. 0.2 drops stocks below the NYSE 20th pct of market cap
  exclude_financials: false   # SIC 6000-6999
  exclude_utilities: false    # SIC 4900-4999

portfolio:
  n_quantiles: 10
  nyse_breakpoints: true      # compute quantile cutoffs on NYSE stocks only
  weighting: [ew, vw]         # report both

costs:
  one_way_bps: 20             # transaction cost per unit of one-way turnover

evaluation:
  factor_models:
    CAPM: [mktrf]
    FF3: [mktrf, smb, hml]
    FF5: [mktrf, smb, hml, rmw, cma]
    FF5+MOM: [mktrf, smb, hml, rmw, cma, mom]
  newey_west_lags: 6
